# CI gate — Fitzpatrick Warranty Service Tracker (Issue #5)
#
# Runs the same checks required before any production deploy:
#   - npm run check  (tsc type-check)
#   - npm run test   (node:test suite)
#   - npm run build  (client + server bundle)
#
# WHY THIS MATTERS: Render auto-deploys on every push to `master`. Without a
# gate, a type error or broken build would deploy straight to production. This
# workflow runs on pull requests targeting `master` so problems are caught
# BEFORE merge, and also on direct pushes to `master` as a backstop.
#
# Make this a required status check in GitHub branch protection (Settings →
# Branches → add rule for `master` → require the "check-and-build" check) so a
# red CI run actually blocks merge.

name: CI

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]

# Cancel superseded runs on the same ref to save minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check-and-build:
    name: check-and-build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies (clean, lockfile-pinned)
        run: npm ci

      - name: Type check (npm run check / tsc)
        run: npm run check

      - name: Test (npm run test)
        run: npm test

      - name: Build (npm run build)
        run: npm run build
