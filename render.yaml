services:
  - type: web
    runtime: node
    name: fitzpatrick-service-tracker
    # Live service is on the Starter plan (verified 2026-06-12). Starter is
    # required because the persistent disk below is not available on the free
    # plan. Do not downgrade to free without first migrating off local SQLite.
    plan: starter
    region: oregon
    buildCommand: npm install && npm run build
    startCommand: NODE_ENV=production node dist/index.cjs
    # Persistent disk holds the production SQLite database and on-disk backups.
    # WITHOUT THIS DISK, the filesystem is ephemeral and all data is lost on
    # every restart/redeploy.
    #
    # Sizing (Issue #4): the backup endpoint keeps the live DB plus up to 9
    # on-disk backup copies (backup-am, backup-pm, backup-{mon..sun}). At the
    # 2026-06-12 DB size (~464 MB) that is ~4.6 GB of backups; the original
    # 1 GB disk was 97% full and a full backup pair failed to write (HTTP 500).
    # Grown to 10 GB on 2026-06-12 to fit the full retention set with headroom
    # for DB growth. NOTE: Render disks can be grown but NEVER shrunk.
    disk:
      name: data
      mountPath: /var/data
      sizeGB: 10
    envVars:
      - key: NODE_ENV
        value: production
      # Points better-sqlite3 at the persistent disk (server/storage.ts falls
      # back to an EPHEMERAL local file if DB_PATH is unset). Verified live
      # 2026-06-12: DB_PATH=/var/data/warranty_tracker.db.
      - key: DB_PATH
        value: /var/data/warranty_tracker.db
      # Shared secret for the authenticated /api/backup endpoints (cron jobs
      # send it via the x-backup-secret header). Set in the Render dashboard;
      # never committed. sync: false keeps it out of this file.
      - key: BACKUP_SECRET
        sync: false

  # ---------------------------------------------------------------------------
  # Automated database backup (Issue #4 — Phase 0 launch blocker).
  # Twice-daily (every 12h) cron that POSTs to the app's /api/backup endpoint.
  # The endpoint uses SQLite's .backup() API for a safe, consistent copy and
  # writes rolling files to the persistent disk: backup-am.db / backup-pm.db
  # (overwritten each half-day) plus backup-{mon..sun}.db (7-day retention).
  #
  # Runs as a lightweight curl image — it does NOT build or run the app, it
  # just calls the already-running web service over HTTPS. Schedule is in UTC.
  #   06:00 UTC -> app records this as the "am" slot (getUTCHours() < 12)
  #   18:00 UTC -> app records this as the "pm" slot (getUTCHours() >= 12)
  # 06:00/18:00 UTC == midnight/noon America/Denver (MDT, UTC-6).
  #
  # BACKUP_SECRET must be set on THIS cron job (sync: false) to the same value
  # as the web service's BACKUP_SECRET; it is sent via the x-backup-secret
  # header (never as a query string, which can leak into logs).
  - type: cron
    name: fitzpatrick-service-tracker-backup
    runtime: image
    image:
      url: docker.io/curlimages/curl:8.11.0
    region: oregon
    plan: starter
    schedule: "0 6,18 * * *"
    envVars:
      - key: BACKUP_SECRET
        sync: false
    # --fail makes curl exit non-zero on HTTP >= 400 so a failed backup shows
    # as a failed cron run in Render. -sS keeps output quiet but shows errors.
    dockerCommand: >-
      sh -c 'curl --fail -sS -X POST
      -H "x-backup-secret: $BACKUP_SECRET"
      https://warranty.fitzpatricksalescrm.com/api/backup'
